name: gameon
description: GameOn — automatic cloud backup for local game saves
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Networking
  dio: ^5.4.3+1
  http: ^1.2.0

  # Google OAuth + Drive
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12

  # Secure local storage (OS keychain)
  flutter_secure_storage: ^9.2.2

  # File system watching
  watcher: ^1.1.0

  # File picker for browsing executables
  file_picker: ^5.5.0

  # File paths (cross-platform: AppData, Documents, etc.)
  path_provider: ^2.1.3
  path: ^1.9.0

  # Encryption
  encrypt: ^5.0.3
  crypto: ^3.0.3

  # Compression
  archive: ^3.6.1

  # Window management (frameless, drag, min/max/close)
  window_manager: ^0.3.9
  bitsdojo_window: ^0.1.6

  # System tray
  tray_manager: ^0.2.3

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cupertino_icons: ^1.0.6

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
