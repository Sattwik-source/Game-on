spring:
  datasource:
    url: jdbc:h2:file:./data/gameon;MODE=PostgreSQL;DATABASE_TO_UPPER=false
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  h2:
    console:
      enabled: true
      path: /h2-console

gameon:
  cors:
    allowed-origins:
      - "http://localhost:*"
