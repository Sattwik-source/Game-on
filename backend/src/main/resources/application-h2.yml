# ═══════════════════════════════════════════════════════════════════════
# H2 profile — embedded, file-based database. No install, no Docker.
#
# Activate with:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2
#
# Data persists to ./data/gameon.mv.db between restarts (delete that
# file to reset). Swap back to the "postgres" defaults in
# application.yml whenever you're ready to install real PostgreSQL —
# nothing else in the app needs to change.
# ═══════════════════════════════════════════════════════════════════════

spring:
  datasource:
    url: jdbc:h2:file:./data/gameon;MODE=PostgreSQL;DATABASE_TO_UPPER=false
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  h2:
    console:
      enabled: true
      path: /h2-console

gameon:
  cors:
    allowed-origins:
      - "http://localhost:*"
