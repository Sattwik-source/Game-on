server:
  port: 8080

spring:
  application:
    name: gameon-api

  datasource:
    url: jdbc:postgresql://localhost:5432/gameon
    username: postgres
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

gameon:
  jwt:
    secret: ${JWT_SECRET:change_me_in_production_min_32_chars_long}
    access-token-expiry-minutes: 15
    refresh-token-expiry-days: 7

  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    # redirect_uri is built dynamically per-request using the loopback
    # port the Flutter desktop app supplies (see AuthController)

  cors:
    allowed-origins:
      - "http://localhost:*"

logging:
  level:
    com.gameon: DEBUG
    org.springframework.security: INFO
