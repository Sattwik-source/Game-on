# Quick H2 embedded database config (all-in-one)
server:
  port: 8080

spring:
  application:
    name: gameon-api

  datasource:
    url: jdbc:h2:file:./data/gameon;MODE=PostgreSQL;DATABASE_TO_UPPER=false
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  flyway:
    enabled: false

  h2:
    console:
      enabled: true
      path: /h2-console

gameon:
  jwt:
    secret: ${JWT_SECRET:temp_dev_secret_min_32_chars_long_change_in_prod}
    access-token-expiry-minutes: 15
    refresh-token-expiry-days: 7

  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}

  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:8080

logging:
  level:
    com.gameon: DEBUG
